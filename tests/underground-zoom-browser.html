<!doctype html><meta charset="utf-8"><title>Underground zoom and single-line market badge</title>
<style>html,body{margin:0}iframe{display:block;border:0}#report{display:none}</style>
<pre id="report">RUNNING</pre><iframe id="game" style="width:665px;height:307px"></iframe>
<script>
(async()=>{
 const frame=document.getElementById('game'),results=[],failures=[];
 const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
 const check=(yes,message)=>{if(!yes)throw Error(message)};
 const capture=async name=>{window.__captureRequest={name};await new Promise(resolve=>window.__continueCapture=resolve)};
 const rect=e=>{const r=e.getBoundingClientRect();return[r.x,r.y,r.width,r.height]};
 const same=(a,b)=>a.every((n,i)=>Math.abs(n-b[i])<.8);
 let stage='load';
 try{
  await new Promise(resolve=>{frame.onload=resolve;frame.src='../index.html?underground-zoom-test=1'});
  const w=frame.contentWindow,d=w.document;
  w.requestAnimationFrame=fn=>w.setTimeout(()=>fn(w.performance.now()),16);w.cancelAnimationFrame=id=>w.clearTimeout(id);
  w.HTMLMediaElement.prototype.play=()=>Promise.resolve();await w.localMatchRecoveryReady;
  w.renderGameTemplate('mainGameTemplate',d.querySelector('.game-container'));
  const player={name:'プレイヤー1',characterId:1,money:0,magicPower:1250,inventory:[],assets:[],magic:[],underground:{position:14,penica:180000,direction:'down',memo:false}};
  w.players=[player];d.getElementById('hudPlayerName').textContent=player.name;d.getElementById('hudPlayerAvatar').style.backgroundImage='url("'+w.eval('PLAYER_CONTENTS')[1].icon+'")';
  d.getElementById('hudMagicValue').textContent='1,250';d.getElementById('turnDisplay').textContent='Turn 13/30';
  const destination=d.getElementById('destinationInfo');destination.classList.add('ug-penica');destination.innerHTML='<span class="ug-penica-value">180,000ペニカ</span>';
  let step=0;
  const render=(position=10,control=true,dispatch=async()=>{},stage='choose')=>{player.underground.position=position;w.UndergroundUI.render({players:w.players,activePlayerIndex:0,currentTurn:13,matchPhase:'playing',undergroundFlow:{turnKey:'zoom-test',step:++step,stage,playerIndex:0,remaining:4,move:4,moveHistory:[position]}},control,dispatch)};
  const addBadge=(kind,rate)=>{
   const hud=d.querySelector('.game-hud');hud.querySelector('.hud-market-badge')?.remove();hud.classList.add('has-market-badge');
   const badge=d.createElement('div');badge.className='hud-market-badge';badge.dataset.season=kind;badge.innerHTML='<span class="hud-market-label">価格変動中</span><strong class="hud-market-rate">'+rate+'</strong>';hud.append(badge);
   // Existing game.js anchor writes; exercise the CSS against its inline width/left.
   const turn=d.getElementById('turnDisplay').getBoundingClientRect(),header=hud.getBoundingClientRect(),s=w.getComputedStyle(hud);
   badge.style.left=(turn.left-header.left-parseFloat(s.borderLeftWidth))+'px';badge.style.top=(turn.bottom-header.top-parseFloat(s.borderTopWidth)+4)+'px';badge.style.width=turn.width+'px';
   return badge;
  };
  for(const [width,height] of [[665,307],[852,393],[640,320],[740,360],[1280,720],[393,852]]){
   stage='layout '+width+'x'+height;frame.style.width=width+'px';frame.style.height=height+'px';await capture(null);await delay(80);
   w.UndergroundUI.suspend();const hudBefore=rect(d.querySelector('.game-hud'));render();await delay(80);
   const hud=d.querySelector('.game-hud'),header=hud.getBoundingClientRect(),map=d.querySelector('.ug-map'),bounds=map.getBoundingClientRect();
   check(same(rect(hud),hudBefore),'HUD moved');
   check(Math.abs(bounds.x+bounds.width/2-width/2)<1&&Math.abs(bounds.y+bounds.height/2-(Math.ceil(header.bottom)+height)/2)<1,'map not centered below HUD');
   const oldCell=Math.min(150,width*.16,Math.max(32,(height-2*Math.ceil(header.bottom)-24)/5.5));
   check(bounds.width>=oldCell*5-.8,'map became smaller');
   if(width===665)check(bounds.width>=oldCell*5*1.3&&bounds.width<=oldCell*5*1.5,'zoom does not match reference area');
   check(bounds.bottom<=height-6,'map clipped below viewport');
   const tiles=[...d.querySelectorAll('.ug-tile')];
   check(tiles.length===w.UndergroundRules.track.length,'map tile count changed');
   for(const tile of tiles){const r=tile.getBoundingClientRect();check(r.top-r.height*.22>=header.bottom-.8,'top-row character can overlap HUD')}
   check(Math.abs(d.querySelector('.ug-marker').getBoundingClientRect().width-tiles[0].getBoundingClientRect().width)<1,'character did not scale with tiles');
   const camera=rect(map);
   for(const position of [0,1,2,14]){render(position);await delay(35);check(same(rect(d.querySelector('.ug-map')),camera),'camera followed player')}
   for(const [kind,rate] of [['crash','−50%'],['boom','＋100%']]){
    const badge=addBadge(kind,rate),label=badge.querySelector('span').getBoundingClientRect(),value=badge.querySelector('strong').getBoundingClientRect(),b=badge.getBoundingClientRect();
    check(label.right<=value.left&&Math.max(label.top,value.top)<Math.min(label.bottom,value.bottom),'badge not on one line');
    check(b.height<40&&b.bottom<header.bottom+44,'badge height not compact');
    check(b.top>=header.bottom+2&&b.top<=header.bottom+6,'badge no longer below turn display');
    check(b.left>=header.left&&b.right<=header.right+.8,'badge extends beyond HUD');
    check(badge.scrollWidth<=badge.clientWidth,'badge text clipped');
    const middle=d.elementFromPoint(b.x+b.width/2,b.y+b.height/2);check(middle?.closest('.hud-market-badge'),'badge covered by underground map');
   }
   addBadge('crash','−50%');render(10,true,async()=>{},'roll');await delay(50);
   if(width===665)await capture('underground-zoom-665x307.png');
   if(width===852)await capture('underground-zoom-852x393.png');
   results.push({viewport:[width,height],map:camera,oldMapWidth:oldCell*5,zoom:bounds.width/(oldCell*5),marketBadge:'single line, compact, visible',HUD:'unchanged'});
  }
  stage='move hit testing';frame.style.width='665px';frame.style.height='307px';await capture(null);await delay(80);
  const sent=[];render(0,true,async action=>{sent.push(action);await delay(30)});await delay(80);
  const arrow=d.querySelector('.ug-arrow'),r=arrow.getBoundingClientRect();check(d.elementFromPoint(r.x+r.width/2,r.y+r.height/2)?.closest('.ug-arrow')===arrow,'zoomed arrow hit area differs');
  arrow.click();arrow.click();await delay(60);check(sent.length===1&&sent[0].action.startsWith('target:'),'movement dispatch changed');
  render(0,false,async()=>sent.push('observer'));await delay(50);d.querySelector('.ug-arrow')?.click();await delay(30);check(sent.length===1,'observer moved player');
  w.UndergroundUI.suspend();check(d.querySelector('.game-container .game-hud')&&d.querySelector('.game-container .action-menu'),'HUD/menu not restored');
  results.push({movement:'zoomed hit area, duplicate-click guard, observer, HUD restoration passed'});stage='complete';
 }catch(error){failures.push(error.stack||String(error))}
 document.getElementById('report').textContent=JSON.stringify({stage,results,failures});document.body.dataset.complete='true';
})();
</script>
