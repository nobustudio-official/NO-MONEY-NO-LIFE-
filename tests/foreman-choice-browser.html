<!doctype html><meta charset="utf-8"><title>Foreman choice regression</title>
<style>html,body{margin:0}#report{display:none}iframe{display:block;border:0}</style>
<pre id="report">RUNNING</pre><iframe id="game" style="width:852px;height:393px"></iframe>
<script>
(async()=>{
 const frame=document.getElementById('game'),results=[],failures=[];
 const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
 const check=(yes,message)=>{if(!yes)throw Error(message)};
 const capture=async name=>{window.__captureRequest={name};await new Promise(resolve=>window.__continueCapture=resolve)};
 const rect=e=>{const r=e.getBoundingClientRect();return[r.x,r.y,r.width,r.height]};
 const same=(a,b)=>a.every((value,i)=>Math.abs(value-b[i])<.75);
 let stage='load',w,d,sequence=0;
 try{
  async function load(baseline=false){
   await new Promise(resolve=>{frame.onload=resolve;frame.src=baseline?'/__foreman_baseline.html':'../index.html?foreman-choice-test=1'});
   w=frame.contentWindow;d=w.document;
   w.requestAnimationFrame=fn=>w.setTimeout(()=>fn(w.performance.now()),16);w.cancelAnimationFrame=id=>w.clearTimeout(id);
   w.HTMLMediaElement.prototype.play=()=>Promise.resolve();
   await w.localMatchRecoveryReady;
   w.renderGameTemplate('mainGameTemplate',d.querySelector('.game-container'));
   w.players=[{name:'プレイヤー1',characterId:1,money:100000,inventory:[],assets:[],magic:[],underground:{position:0,penica:140000,memo:false}}];
   d.getElementById('hudPlayerName').textContent=w.players[0].name;
   d.getElementById('hudPlayerAvatar').style.backgroundImage='url("'+w.eval('PLAYER_CONTENTS')[1].icon+'")';
   d.getElementById('hudMagicValue').textContent='1,250';d.getElementById('turnDisplay').textContent='Turn 9/30';
   const destination=d.getElementById('destinationInfo');destination.classList.add('ug-penica');destination.innerHTML='<span class="ug-penica-value">140,000ペニカ</span>';
  }
  await load();
  const styles=e=>{const s=w.getComputedStyle(e);return[s.fontFamily,s.fontSize,s.fontWeight,s.lineHeight,s.paddingTop,s.paddingRight,s.paddingBottom,s.paddingLeft,s.color,s.backgroundColor,s.borderTopWidth,s.borderTopColor,s.borderRadius,s.boxShadow,s.animationName,s.translate]};
  const render=(memo=false,retry=false,control=true,dispatch=async()=>{},stage='offer')=>{
   w.players[0].underground.memo=memo;
   const state={players:w.players,currentTurn:9,activePlayerIndex:0,matchPhase:'playing',undergroundFlow:{stage,page:0,playerIndex:0,step:++sequence,turnKey:'foreman-test',retry}};
   w.UndergroundUI.render(state,control,dispatch);return state;
  };
  const job=()=>d.getElementById('jobPopup');
  async function showJob(){
   w.UndergroundUI.suspend();
   const popup=job();popup.replaceChildren(d.getElementById('jobPopupContentTemplate').content.cloneNode(true));popup.style.display='block';
   const scene=popup.querySelector('.job-scene'),staff=popup.querySelector('.job-staff'),data=w.eval('JOB_CONTENTS')[1],background=popup.querySelector('.job-background');
   staff.src=data.staffImage;background.src=data.backgroundImage;await Promise.all([staff.decode(),background.decode()]);
   popup.querySelector('.job-dialogue-box').style.display='none';popup.querySelector('.job-choice-panel').hidden=false;
   w.Plane02Layout.apply(scene,{once:true});w.Plane02Layout.apply(scene);
   w.JobPresentation.paintChoices({popup,wage:popup.querySelector('.job-wage')},10000);w.JobPresentation.placeChoices({popup});await delay(70);
   const buttons=[popup.querySelector('.job-work-button'),popup.querySelector('.job-none-button')];
   return{cards:buttons.map(rect),styles:buttons.map(styles),caption:rect(popup.querySelector('.job-choice-panel'))};
  }
  function hideJob(){w.JobPresentation.releaseChoices({popup:job()});w.Plane02Layout.release(job().querySelector('.job-scene'));job().style.display='none'}
  const baselineComparisons=[];
  for(const [width,height] of [[1920,1080],[1280,720],[852,393],[740,360],[640,320],[393,852]]){
   stage='geometry '+width+'x'+height;frame.style.width=width+'px';frame.style.height=height+'px';await capture(null);await delay(80);w.PlayerCardSize.refresh();
   const reference=await showJob();hideJob();
   baselineComparisons.push({width,height,job:reference});
   for(const memo of [false,true])for(const retry of [false,true]){
    render(memo,retry);await delay(70);
    const buttons=[...d.querySelectorAll('.ug-options button')],caption=d.querySelector('.ug-caption');
    check(buttons.length===2,'missing cards');
    check(buttons.every((button,i)=>same(rect(button),reference.cards[i])),'card geometry differs '+JSON.stringify({expected:reference.cards,actual:buttons.map(rect)}));
    check(buttons.every((button,i)=>JSON.stringify(styles(button))===JSON.stringify(reference.styles[i])),'card styles differ '+JSON.stringify({expected:reference.styles,actual:buttons.map(styles)}));
    check(same(rect(caption),reference.caption),'AN02 position changed');
    check(buttons[0].textContent===(memo?'メモ帳を所持して挑戦':'挑戦する')&&buttons[1].textContent==='断る','labels changed');
    check(caption.querySelector('p').textContent===(retry?'もうひと勝負していくか？':'どうだ、お前もやっていくか？'),'announcement changed');
    check(buttons.every(b=>b.getBoundingClientRect().bottom<=caption.getBoundingClientRect().top-6),'cards overlap caption');
    for(const button of buttons){const front=button.querySelector('.br-card-front');check(front.scrollWidth<=front.clientWidth&&front.getBoundingClientRect().height<button.clientHeight-30,'label clipped')}
    if(width===852&&!retry)await capture('foreman-choice-852x393-'+(memo?'memo':'normal')+'.png');
    if(width===640&&memo&&!retry)await capture('foreman-choice-640x320-memo.png');
    results.push({viewport:[width,height],memo,retry,cards:buttons.map(rect),style:'matches job'});
   }
   // Resize the live offer, then compare with a fresh job layout at that size.
   frame.style.width=(width-24)+'px';await capture(null);await delay(100);
   const resized=[...d.querySelectorAll('.ug-options button')].map(rect),resizedJob=await showJob();hideJob();
   check(resized.every((bounds,i)=>same(bounds,resizedJob.cards[i])),'live resize differs from job');
   frame.style.width=width+'px';await capture(null);await delay(70);
  }
  stage='actions';frame.style.width='852px';frame.style.height='393px';await capture(null);await delay(70);
  for(const memo of [false,true])for(const action of ['challenge','decline']){
   const sent=[];render(memo,false,true,async value=>{sent.push(value);await delay(30)});
   d.querySelector('.ug-caption').click();await delay(10);check(!sent.length,'caption submitted choice');
   const button=d.querySelector('[data-action="'+action+'"]');button.querySelector('span').click();button.click();await delay(60);
   check(sent.length===1&&sent[0].action===action&&sent[0].stage==='offer','choice dispatch changed');
  }
  let actions=0;const state=render(true,false,false,async()=>actions++);
  for(const button of d.querySelectorAll('.ug-options button')){check(button.disabled,'observer enabled');button.click()}
  await delay(30);check(actions===0,'observer sent action');
  w.UndergroundUI.render(state,true,async()=>actions++);
  check([...d.querySelectorAll('.ug-options button')].every(button=>!button.disabled),'ownership change left buttons disabled');
  d.querySelector('.ug-challenge').click();await delay(30);check(actions===1,'new owner cannot choose');
  render(false,false,true,async()=>{},'foreman');check(!d.querySelector('.ug-options'),'offer cards survived stage change');
  w.UndergroundUI.suspend();check(d.querySelector('.game-container .game-hud')&&d.querySelector('.game-container .action-menu'),'HUD/menu not restored');
  results.push({actions:'challenge/decline with and without memo; double-click, observer, ownership, cleanup passed',liveResize:'six sizes passed'});
  // Compare the actual job UI and nearby underground screens against unmodified assets.
  stage='other UI';
  const snapshot=()=>[...d.querySelectorAll('.ug-scene,.ug-character,.ug-caption,.ug-caption>*')].map(e=>[e.tagName,e.textContent,...rect(e),...styles(e)]);
  const otherScreens=[];
  for(const stage of ['foreman','guard','declined','memo']){render(false,false,false,async()=>{},stage);await delay(70);otherScreens.push({stage,snapshot:snapshot()})}
  w.UndergroundUI.suspend();await load(true);
  for(const reference of baselineComparisons){
   frame.style.width=reference.width+'px';frame.style.height=reference.height+'px';await capture(null);await delay(70);w.PlayerCardSize.refresh();
   const original=await showJob();hideJob();
   check(JSON.stringify(original)===JSON.stringify(reference.job),'job UI changed at '+reference.width+'x'+reference.height);
  }
  frame.style.width='852px';frame.style.height='393px';await capture(null);await delay(70);
  for(const reference of otherScreens){render(false,false,false,async()=>{},reference.stage);await delay(70);check(JSON.stringify(snapshot())===JSON.stringify(reference.snapshot),'other underground screen changed: '+reference.stage)}
  w.UndergroundUI.suspend();results.push({baseline:'job unchanged at six sizes; foreman, guard, declined, memo unchanged'});
  stage='complete';
 }catch(error){failures.push(error.stack||String(error))}
 document.getElementById('report').textContent=JSON.stringify({stage,results,failures});document.body.dataset.complete='true';
})();
</script>
